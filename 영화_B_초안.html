<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>내 영화 티어리스트</title>
<style>
  :root{
    --color-s:#FF7F7F;
    --color-a:#FFBF7F;
    --color-b:#FFFF7F;
    --color-c:#7FFF7F;
    --color-d:#7FBFFF;
    --gap:12px;
    --card-bg:#ffffff;
    --card-border:#ddd;
    --zone-bg:#fafafa;
  }
  *{box-sizing:border-box;font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;}
  body{margin:0;padding:20px;background:#f4f6f8;color:#222;}
  h1{margin:0 0 12px 0;font-size:20px;}
  .topbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
  .topbar input[type="text"]{
    flex:1;min-width:160px;padding:10px;border:1px solid #ccc;border-radius:6px;
  }
  .topbar button{padding:10px 12px;border:none;border-radius:6px;background:#333;color:#fff;cursor:pointer;}
  .topbar button.secondary{background:#666;}
  .container{display:flex;flex-direction:column;gap:10px;}
  .tier-row{display:flex;gap:8px;align-items:stretch;}
  .tier-label{
    min-width:68px;padding:12px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#111;font-weight:700;
    flex:0 0 88px;
  }
  .tier-drop{
    flex:1;min-height:80px;padding:10px;border-radius:8px;background:var(--zone-bg);
    border:2px dashed transparent;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;
  }
  .tier-drop.dragover{border-color:#999;background:#fff;}
  .movie-card{
    display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--card-bg);
    border:1px solid var(--card-border);box-shadow:0 1px 2px rgba(0,0,0,0.04);cursor:grab;
    user-select:none;
  }
  .movie-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .delete-btn{background:#e74c3c;color:#fff;border:none;padding:6px 8px;border-radius:6px;cursor:pointer;font-weight:700;}
  /* Colors for labels */
  .label-s{background:var(--color-s);}
  .label-a{background:var(--color-a);}
  .label-b{background:var(--color-b);}
  .label-c{background:var(--color-c);}
  .label-d{background:var(--color-d);}
  /* subtle tinted background for drop areas */
  .drop-s{background:linear-gradient(90deg, rgba(255,127,127,0.08), rgba(255,255,255,0));}
  .drop-a{background:linear-gradient(90deg, rgba(255,191,127,0.08), rgba(255,255,255,0));}
  .drop-b{background:linear-gradient(90deg, rgba(255,255,127,0.08), rgba(255,255,255,0));}
  .drop-c{background:linear-gradient(90deg, rgba(127,255,127,0.08), rgba(255,255,255,0));}
  .drop-d{background:linear-gradient(90deg, rgba(127,191,255,0.08), rgba(255,255,255,0));}
  /* Unclassified area styling */
  .unclassified-wrap{margin-top:8px;}
  .unclassified-label{font-weight:700;margin-bottom:6px;}
  .unclassified-drop{min-height:70px;padding:10px;border-radius:8px;background:#fff;border:1px solid #e6e6e6;display:flex;flex-wrap:wrap;gap:8px;}
  /* Responsive */
  @media (max-width:600px){
    body{padding:12px;}
    .tier-row{flex-direction:column;}
    .tier-label{flex:0 0 auto;width:100%;min-width:0;}
    .tier-drop{width:100%;}
    .movie-card{width:100%;}
    .topbar{flex-direction:column;align-items:stretch;}
    .topbar button{width:100%;}
  }
</style>
</head>
<body>
<h1>내 영화 티어리스트</h1>

<div class="topbar">
  <input id="titleInput" type="text" placeholder="영화 제목을 입력하세요" />
  <button id="addBtn">추가</button>
  <button id="resetBtn" class="secondary">전체 초기화</button>
</div>

<div class="container" id="tiers">
  <div class="tier-row" data-tier="S">
    <div class="tier-label label-s">S</div>
    <div class="tier-drop drop-s" data-tier="S"></div>
  </div>
  <div class="tier-row" data-tier="A">
    <div class="tier-label label-a">A</div>
    <div class="tier-drop drop-a" data-tier="A"></div>
  </div>
  <div class="tier-row" data-tier="B">
    <div class="tier-label label-b">B</div>
    <div class="tier-drop drop-b" data-tier="B"></div>
  </div>
  <div class="tier-row" data-tier="C">
    <div class="tier-label label-c">C</div>
    <div class="tier-drop drop-c" data-tier="C"></div>
  </div>
  <div class="tier-row" data-tier="D">
    <div class="tier-label label-d">D</div>
    <div class="tier-drop drop-d" data-tier="D"></div>
  </div>
</div>

<div class="unclassified-wrap">
  <div class="unclassified-label">미분류 영화</div>
  <div class="unclassified-drop" id="unclassified"></div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'movieTierList_v1';
  const initialMovies = [
    "기생충",
    "인터스텔라",
    "라라랜드",
    "센과 치히로의 행방불명",
    "어벤져스: 엔드게임",
    "범죄도시",
    "타이타닉",
    "토이 스토리"
  ];

  // state: array of {id, title, tier}
  let movies = [];

  // DOM refs
  const addBtn = document.getElementById('addBtn');
  const resetBtn = document.getElementById('resetBtn');
  const titleInput = document.getElementById('titleInput');
  const dropzones = document.querySelectorAll('.tier-drop');
  const unclassifiedDrop = document.getElementById('unclassified');

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(movies));
    }catch(e){
      console.warn('Cannot save to localStorage', e);
    }
  }
  function loadState(){
    const data = localStorage.getItem(STORAGE_KEY);
    if(data){
      try{
        movies = JSON.parse(data);
        // basic validation
        if(!Array.isArray(movies)) throw new Error('invalid');
        return;
      }catch(e){
        console.warn('Failed to parse saved data, initializing defaults.');
      }
    }
    // initialize defaults: all unclassified
    movies = initialMovies.map((t,i)=>({id: 'm'+(Date.now()+i), title: t, tier: 'unclassified'}));
    saveState();
  }

  function createCard(movie){
    const div = document.createElement('div');
    div.className = 'movie-card';
    div.draggable = true;
    div.dataset.id = movie.id;

    const span = document.createElement('div');
    span.className = 'movie-title';
    span.textContent = movie.title;

    const btn = document.createElement('button');
    btn.className = 'delete-btn';
    btn.textContent = 'X';
    btn.title = '삭제';

    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      deleteMovie(movie.id);
    });

    div.appendChild(span);
    div.appendChild(btn);

    // drag events
    div.addEventListener('dragstart', (e)=>{
      e.dataTransfer.setData('text/plain', movie.id);
      // visual feedback
      setTimeout(()=>div.classList.add('dragging'), 0);
    });
    div.addEventListener('dragend', (e)=>{
      div.classList.remove('dragging');
      saveState();
    });

    return div;
  }

  function render(){
    // clear dropzones
    dropzones.forEach(z=>z.innerHTML='');
    unclassifiedDrop.innerHTML='';

    // append in order of movies array
    movies.forEach(m=>{
      const card = createCard(m);
      if(m.tier && m.tier !== 'unclassified'){
        const zone = document.querySelector('.tier-drop[data-tier="'+m.tier+'"]');
        if(zone) zone.appendChild(card);
        else unclassifiedDrop.appendChild(card);
      }else{
        unclassifiedDrop.appendChild(card);
      }
    });
  }

  // drag & drop handlers for dropzones
  function setupDropzone(z){
    z.addEventListener('dragover', (e)=>{
      e.preventDefault();
      z.classList.add('dragover');
    });
    z.addEventListener('dragleave', ()=>z.classList.remove('dragover'));
    z.addEventListener('drop', (e)=>{
      e.preventDefault();
      z.classList.remove('dragover');
      const id = e.dataTransfer.getData('text/plain');
      moveMovieTo(id, z.dataset.tier || 'unclassified');
    });
  }
  dropzones.forEach(setupDropzone);
  // unclassified
  unclassifiedDrop.addEventListener('dragover', (e)=>{ e.preventDefault(); unclassifiedDrop.classList.add('dragover');});
  unclassifiedDrop.addEventListener('dragleave', ()=>unclassifiedDrop.classList.remove('dragover'));
  unclassifiedDrop.addEventListener('drop', (e)=>{
    e.preventDefault(); unclassifiedDrop.classList.remove('dragover');
    const id = e.dataTransfer.getData('text/plain');
    moveMovieTo(id, 'unclassified');
  });

  function moveMovieTo(id, tier){
    const idx = movies.findIndex(m=>m.id===id);
    if(idx === -1) return;
    movies[idx].tier = tier;
    render();
    saveState();
  }

  function deleteMovie(id){
    movies = movies.filter(m=>m.id !== id);
    render();
    saveState();
  }

  addBtn.addEventListener('click', ()=>{
    const title = titleInput.value.trim();
    if(!title){
      alert('영화 제목을 입력해주세요!');
      return;
    }
    const id = 'm'+Date.now()+Math.floor(Math.random()*1000);
    movies.push({id, title, tier:'unclassified'});
    titleInput.value = '';
    render();
    saveState();
  });

  // allow Enter key to add
  titleInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') addBtn.click();
  });

  resetBtn.addEventListener('click', ()=>{
    if(!confirm('정말 모든 영화를 미분류로 되돌리겠습니까?')) return;
    movies = movies.map(m=>({...m, tier:'unclassified'}));
    render();
    saveState();
  });

  // initialize
  loadState();
  render();

  // auto-save on unload
  window.addEventListener('beforeunload', saveState);

  // expose for debugging (optional)
  window._movieTier = {
    getState: ()=>movies,
    save: saveState,
    load: ()=>{ loadState(); render(); }
  };
})();
</script>
</body>
</html>
